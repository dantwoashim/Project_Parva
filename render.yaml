services:
  - type: web
    name: project-parva-public-demo
    env: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -c requirements/constraints.txt -e .
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONPATH
        value: backend
      - key: PARVA_ROUTE_PROFILE
        value: developer_preview
      - key: PARVA_ENABLE_EXPERIMENTAL_API
        value: "false"
      - key: PARVA_ALLOW_EXPERIMENTAL_IN_PROD
        value: "false"
      - key: PARVA_SHOW_PRIVATE_SCHEMA
        value: "false"
      - key: PARVA_ENV
        value: public
      - key: PARVA_SOURCE_URL
        value: https://github.com/dantwoashim/Project_Parva
      - key: PARVA_RATE_LIMIT_ENABLED
        value: "true"
      - key: PARVA_RATE_LIMIT_BACKEND
        value: memory
      - key: PARVA_REQUIRE_PRECOMPUTED
        value: "false"
      - key: PARVA_PREWARM_HOTSET
        value: "true"
      - key: PARVA_SERVE_FRONTEND
        value: "false"
      - key: CORS_ALLOW_ORIGINS
        value: https://prabinghimire1.com.np,https://www.prabinghimire1.com.np,https://project-parva.pages.dev,https://dantwoashim.github.io
