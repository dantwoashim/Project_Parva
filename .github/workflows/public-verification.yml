name: Public verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"
      - name: Install backend public dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints.txt -e .[test,dev]
      - name: Verify toolchain
        run: python scripts/verify_environment.py

  backend-public:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend public dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints.txt -e .[test,dev]
      - name: Run backend public gates
        env:
          PYTHONPATH: backend:.
        run: |
          python scripts/release/regenerate_public_release_hashes.py --check
          python scripts/parva_trust_verify.py
          python scripts/check_docs_links.py
          python scripts/check_path_leaks.py
          python scripts/check_future_bs_public_leakage.py
          python scripts/release/check_public_openapi_drift.py
          python -m pytest -q -m "not private_source and not wide_corpus and not research_artifact" --maxfail=20

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install governance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints.txt -e .[test,dev]
      - name: Run governance gates
        env:
          PYTHONPATH: backend:.
        run: |
          python scripts/check_canonical_runtime.py
          python scripts/check_maturity_lanes.py
          python tools/validate_schemas.py
          python scripts/validate_external_temporal_rules.py
          python scripts/release/check_route_inventory.py
          python scripts/release/check_documented_routes.py
          python scripts/release/check_public_claims.py
          python scripts/release/check_public_safety_gate.py
          python scripts/release/verify_clean_clone_assumptions.py
          python scripts/release/check_archive_hygiene.py
          python scripts/release/check_package_readiness.py
          python scripts/release/check_mcp_registry_metadata.py
          python scripts/sheets/validate_sheet_examples.py
          python scripts/conformance/generate_conformance_report.py --input samples/conformance/vendor_input_sample.csv --json-out samples/conformance/conformance_report_sample.json --md-out samples/conformance/conformance_report_sample.md
          python scripts/vendor_audit/run_vendor_date_risk_audit.py --input samples/vendor-date-risk-audit/input_sample.csv --json-out samples/vendor-date-risk-audit/output_report_sample.json --md-out samples/vendor-date-risk-audit/output_report_sample.md
          python scripts/frontend/check_component_size.py
          python scripts/release/check_python_module_size.py
          python scripts/release/check_repo_hygiene.py
          python -m pytest tests/evidence tests/conformance tests/vendor_audit -q

  sdk-agent-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/parva-js/package-lock.json
            packages/parva-local-kernel/package-lock.json
      - name: Install SDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints.txt -e .[test,dev]
          python -m pip install -e packages/parva-python
          python -m pip install -e packages/parva-mcp-server
          npm --prefix packages/parva-js ci
          npm --prefix packages/parva-local-kernel ci
      - name: Run SDK and adapter tests
        run: |
          python -m pytest packages/parva-python/tests -q
          python -m build packages/parva-python
          python -m build packages/parva-agent-tools
          python -m build packages/parva-mcp-server
          npm --prefix packages/parva-js test
          npm --prefix packages/parva-js audit --audit-level=moderate
          cd packages/parva-js
          npm pack --dry-run
          cd ../..
          npm --prefix packages/parva-local-kernel test
          npm --prefix packages/parva-local-kernel audit --audit-level=moderate
          cd packages/parva-local-kernel
          npm pack --dry-run
          cd ../..
          python -m pytest packages/parva-agent-tools/tests packages/parva-mcp-server/tests -q
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n' | python -m parva_mcp_server.server --stdio

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Run frontend gates
        run: |
          npm --prefix frontend audit --audit-level=moderate
          npm --prefix frontend run lint
          npm --prefix frontend test -- --run
          npm --prefix frontend run build

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: public-benchmark/competitors/package-lock.json
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints.txt -e .[test]
          npm --prefix public-benchmark/competitors ci --ignore-scripts
      - name: Run public benchmark
        env:
          PYTHONPATH: backend:.
        run: |
          python public-benchmark/runners/run_against_static_baseline.py
          python public-benchmark/runners/run_against_parva.py
          python public-benchmark/runners/compare_results.py
          python public-benchmark/runners/run_competitor_comparison.py
          python scripts/benchmark/generate_benchmark_badge.py

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/parva-js/package-lock.json
            packages/parva-local-kernel/package-lock.json
      - name: Install release gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints.txt -e .[test,dev]
          python -m pip install -e packages/parva-python
          npm --prefix frontend ci
          npm --prefix packages/parva-js ci
          npm --prefix packages/parva-local-kernel ci
      - name: Run public release gate
        env:
          PARVA_PYTHON: python
        run: python scripts/release/verify_public.py
