name: Public verification

on:
  push:
  pull_request:

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            packages/parva-js/package-lock.json

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints.txt -e .[test,dev]
          python -m pip install -e sdk/python
          python -m pip install -e packages/parva-python
          npm --prefix frontend ci
          npm --prefix packages/parva-js ci

      - name: Run public reproducibility gate
        env:
          PARVA_PYTHON: python
        run: python scripts/release/verify_public.py

      - name: Upload public verification artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-verification-artifacts
          path: |
            reports
            dist
            output
          if-no-files-found: ignore
