name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node for SDK dependency audit
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/parva-js/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints.txt -e .[test,dev]
          python -m pip install -e packages/parva-python
          npm --prefix packages/parva-js ci

      - name: Run backend quality gates
        env:
          PYTHONPATH: backend:.
        run: |
          python -m ruff check backend tests scripts sdk packages/parva-python packages/parva-ai-tools packages/parva-mcp-server
          python -m pip_audit --strict --requirement requirements/constraints.txt
          npm --prefix packages/parva-js audit --audit-level=high
          python scripts/release/check_repo_hygiene.py
          python scripts/release/verify_clean_clone_assumptions.py
          python scripts/release/check_archive_hygiene.py
          python scripts/release/check_package_readiness.py
          python scripts/release/check_mcp_registry_metadata.py
          python scripts/security/scan_repo_secrets.py
          python scripts/release/check_public_safety_gate.py
          python scripts/release/check_render_blueprint.py
          python scripts/validate_festival_catalog.py
          python scripts/check_docs_links.py
          python scripts/check_path_leaks.py
          python scripts/check_future_bs_public_leakage.py
          python scripts/release/check_public_claims.py
          python scripts/validate_external_temporal_rules.py
          python scripts/sheets/validate_sheet_examples.py
          python scripts/conformance/generate_conformance_report.py --input samples/conformance/vendor_input_sample.csv --json-out samples/conformance/conformance_report_sample.json --md-out samples/conformance/conformance_report_sample.md
          python scripts/vendor_audit/run_vendor_date_risk_audit.py --input samples/vendor-date-risk-audit/input_sample.csv --json-out samples/vendor-date-risk-audit/output_report_sample.json --md-out samples/vendor-date-risk-audit/output_report_sample.md
          python public-benchmark/validate_benchmark.py
          python scripts/benchmark/generate_benchmark_badge.py
          python scripts/release/check_route_inventory.py
          python scripts/release/check_documented_routes.py
          python scripts/release/check_public_openapi_drift.py
          python scripts/release/check_backend_smoke.py
          python scripts/release/check_sdk_install.py
          python scripts/spec/run_conformance_tests.py
          python public-benchmark/runners/run_against_static_baseline.py
          python public-benchmark/runners/run_against_parva.py
          python public-benchmark/runners/compare_results.py

      - name: Run backend tests
        run: python -m pytest -q -m "not private_source and not wide_corpus and not research_artifact" --maxfail=20

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for live product checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install backend runtime for live product checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run frontend quality gates
        run: |
          npm --prefix frontend audit --audit-level=high
          python scripts/frontend/check_component_size.py
          npm --prefix frontend run lint
          npm --prefix frontend test -- --run
          npm --prefix frontend run build
