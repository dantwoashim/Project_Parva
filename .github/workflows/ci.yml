name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node for SDK dependency audit
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/parva-js/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test,dev]
          python -m pip install -e sdk/python
          npm --prefix packages/parva-js ci

      - name: Run backend quality gates
        run: |
          python -m ruff check backend tests scripts sdk
          python -m pip_audit --strict
          npm --prefix packages/parva-js audit --audit-level=high
          python scripts/release/check_repo_hygiene.py
          python scripts/security/scan_repo_secrets.py
          python scripts/release/check_public_safety_gate.py
          python scripts/release/check_render_blueprint.py
          python scripts/release/check_cloudrun_blueprint.py
          python scripts/validate_festival_catalog.py
          python scripts/release/check_license_compliance.py
          python scripts/check_docs_links.py
          python scripts/check_path_leaks.py
          python scripts/release/check_contract_freeze.py
          python scripts/release/check_route_inventory.py
          python scripts/release/check_documented_routes.py
          python scripts/release/check_backend_smoke.py
          python scripts/release/check_sdk_install.py
          python scripts/spec/run_conformance_tests.py
          python scripts/release/package_source_archive.py
          python scripts/release/verify_source_archive.py
          PARVA_ENV=production PARVA_SOURCE_URL=https://example.com/source PARVA_ROUTE_PROFILE=public_reference PARVA_RATE_LIMIT_BACKEND=redis PARVA_REDIS_URL=redis://localhost:6379/0 PARVA_REQUIRE_PRECOMPUTED=false PARVA_PROVENANCE_ATTESTATION_KEY=test-provenance-key PARVA_PLACE_SEARCH_ALLOW_REMOTE=false PARVA_PLACE_SEARCH_PROVIDER_CHAIN=offline PARVA_PLACE_SEARCH_PROVIDER_POLICY=offline_only python scripts/release/check_production_preflight.py

      - name: Build Docker image
        run: docker build -t project-parva-ci .

      - name: Build Cloud Run Docker image
        run: docker build -f Dockerfile.cloudrun -t project-parva-cloudrun-ci .

      - name: Run backend tests
        run: pytest -q backend/tests tests/unit tests/contract

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for live product checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install backend runtime for live product checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run frontend quality gates
        run: |
          npm --prefix frontend audit --audit-level=high
          npm --prefix frontend run lint
          npm --prefix frontend test -- --run
          npm --prefix frontend run test:visual
          npm --prefix frontend run build

      - name: Run live route, accessibility, and product-loop gates
        run: |
          python scripts/run_browser_smoke.py --timeout-seconds 60
          python scripts/run_frontend_accessibility.py --timeout-seconds 60
          python scripts/run_golden_journeys.py --timeout-seconds 60

      - name: Upload frontend QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-live-qa
          path: |
            reports/release/browser_smoke.json
            reports/release/frontend_accessibility.json
            reports/release/golden_journeys.json
            output/playwright
