[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-parva-python-sdk"
version = "0.1.0a0"
description = "Public-safe Python SDK alpha for Project Parva calendar APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Project Parva" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["parva*"]

[tool.pytest.ini_options]
pythonpath = ["."]
