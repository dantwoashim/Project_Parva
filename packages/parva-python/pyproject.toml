[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parva-python"
version = "0.3.0a0"
description = "Python SDK for Project Parva's public Nepali calendar APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Project Parva" }]
dependencies = []
keywords = ["nepal", "bikram-sambat", "calendar", "panchanga", "fiscal-year"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/dantwoashim/Project_Parva"
Repository = "https://github.com/dantwoashim/Project_Parva"
Documentation = "https://github.com/dantwoashim/Project_Parva/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/dantwoashim/Project_Parva/issues"

[project.scripts]
parva = "parva.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parva*"]

[tool.pytest.ini_options]
pythonpath = ["."]
