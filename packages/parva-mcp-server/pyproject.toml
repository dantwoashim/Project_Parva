[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parva-mcp-server"
version = "1.0.0"
description = "Production read-only MCP server for Project Parva temporal tools."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Project Parva" }]
dependencies = [
    "anyio>=4.5,<5.0",
    "httpx>=0.28.1,<1.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "mcp>=1.28.1,<2.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/dantwoashim/Project_Parva"
Repository = "https://github.com/dantwoashim/Project_Parva"
Documentation = "https://github.com/dantwoashim/Project_Parva/blob/main/packages/parva-mcp-server/README.md"

[project.scripts]
parva-mcp-server = "parva_mcp_server.server:main"

[project.optional-dependencies]
test = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["parva_mcp_server*"]
